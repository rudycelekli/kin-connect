name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke test the packed release with hoisted dependencies
        run: node scripts/smoke-install.mjs
      - run: npm run build:demo
      - run: npm run demo:agents
      - run: node scripts/adr-index.mjs --check
      - run: npm run plugin:package -- --draft
  browser:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results
  installer:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          node -e "require('node:fs').mkdirSync('artifacts', { recursive: true })"
      - run: npm pack --pack-destination artifacts
      - name: Test a real npm-exec install with an empty cache and external working directory
        run: node scripts/smoke-npx.mjs --package artifacts/kin-people-0.2.1.tgz --expected-version 0.2.1
  public-installer:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published HTTPS archive through npm-exec with a fresh cache
        run: node scripts/smoke-npx.mjs
  container:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kin-check .
      - run: |
          mkdir -p /tmp/kin-volume
          docker run -d --name kin-check -p 4320:4318 -v /tmp/kin-volume:/data -e KIN_PUBLIC_ORIGIN=https://kin.example kin-check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4320/api/network/health; then
              docker exec --user node kin-check touch /data/volume-permission-check
              exit 0
            fi
            sleep 1
          done
          docker logs kin-check
          exit 1
      - name: Verify graceful shutdown and restart preserve the volume without a stale lock
        run: |
          docker stop --time 15 kin-check
          test ! -e /tmp/kin-volume/.kin-process.lock
          docker start kin-check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4320/api/network/health; then
              docker exec --user node kin-check test -f /data/volume-permission-check
              exit 0
            fi
            sleep 1
          done
          docker logs kin-check
          exit 1
